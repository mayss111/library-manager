<div class="container">
  <h2>Liste des livres</h2>

  <div class="toolbar">
    <button class="btn btn-primary" (click)="goToNew()">Ajouter un livre</button>

    <div class="filters">
      <input
        type="text"
        placeholder="Rechercher par titre ou auteur..."
        [(ngModel)]="searchTerm"
        (input)="onFiltersChange()"
      />

      <select [(ngModel)]="selectedCategory" (change)="onFiltersChange()">
        <option value="all">Toutes catégories</option>
        <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      </select>

      <select [(ngModel)]="selectedAvailability" (change)="onFiltersChange()">
        <option value="all">Tous</option>
        <option value="available">Disponibles</option>
        <option value="unavailable">Empruntés</option>
      </select>
    </div>
  </div>

  <p *ngIf="loading">Chargement...</p>
  <p *ngIf="error">{{ error }}</p>

  <p *ngIf="!loading && !error">
    {{ filteredBooks.length }} livre(s) trouvé(s)
  </p>

  <div
  class="cards-grid"
  *ngIf="!loading && !error && filteredBooks.length; else noBooks"
>
  <div class="book-card" *ngFor="let b of filteredBooks">
    <div class="book-card-header">
      <h3>{{ b.title }}</h3>
      <span class="badge" [class.badge-available]="b.available" [class.badge-unavailable]="!b.available">
        {{ b.available | available }}
      </span>
    </div>

    <p class="author">{{ b.author }}</p>
    <p class="category">{{ b.category }} • {{ b.publishedYear }}</p>

    <div class="rating">
      <app-star-rating [rating]="b.rating"></app-star-rating>
    </div>

    <div class="card-actions">
      <button class="btn btn-secondary" (click)="showDetails(b.id)">Détails</button>
      <button class="btn btn-warning" (click)="editBook(b.id)">Modifier</button>
      <button class="btn btn-danger" (click)="deleteBook(b.id)">Supprimer</button>
    </div>
  </div>
</div>


  <ng-template #noBooks>
    <p>Aucun livre ne correspond aux critères.</p>
  </ng-template>
</div>
